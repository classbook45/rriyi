    # ──────────────────────────────────────────────────────────────
    # 3. INSTALL XCODEGEN + GENERATE PROJECT
    # ──────────────────────────────────────────────────────────────
    - name: Install xcodegen
      run: brew install xcodegen --quiet

    - name: Write project.yml
      run: |
        cat > project.yml << 'YML'
        name: DopamineJester
        options:
          bundleIdPrefix: com.sussy
          deploymentTarget:
            iOS: "14.0"
          xcodeVersion: "16"
          generateEmptyDirectories: true

        settings:
          base:
            CLANG_ENABLE_OBJC_ARC: YES
            PRODUCT_BUNDLE_IDENTIFIER: com.sussy.dopaminejester
            INFOPLIST_FILE: DopamineJester/Info.plist
            CODE_SIGN_ENTITLEMENTS: DopamineJester/DopamineJester.entitlements
            SDKROOT: iphoneos
            SUPPORTED_PLATFORMS: iphoneos
            TARGETED_DEVICE_FAMILY: "1,2"
            OTHER_LDFLAGS: "-framework UIKit -framework Foundation -framework CoreGraphics"
            CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: NO

        targets:
          DopamineJester:
            type: application
            platform: iOS
            deploymentTarget: "14.0"
            sources:
              - path: DopamineJester
                excludes:
                  - "**/*.md"
                  - "**/*.plist"
                  - "**/*.entitlements"
            info:
              path: DopamineJester/Info.plist
        YML

    - name: Generate Xcode project
      run: xcodegen generate

    # ──────────────────────────────────────────────────────────────
    # 4. BUILD
    # ──────────────────────────────────────────────────────────────
    - name: Build unsigned
      run: |
        xcodebuild \
          -project DopamineJester.xcodeproj \
          -scheme DopamineJester \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ONLY_ACTIVE_ARCH=NO \
          CONFIGURATION_BUILD_DIR="$PWD/build/app" \
          clean build 2>&1 | xcpretty || \
        xcodebuild \
          -project DopamineJester.xcodeproj \
          -scheme DopamineJester \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ONLY_ACTIVE_ARCH=NO \
          CONFIGURATION_BUILD_DIR="$PWD/build/app" \
          clean build

    # ──────────────────────────────────────────────────────────────
    # 5. PACKAGE IPA
    # ──────────────────────────────────────────────────────────────
    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/app/DopamineJester.app Payload/
        zip -r DopamineJester.ipa Payload/
        rm -rf Payload
        echo "IPA size: $(du -sh DopamineJester.ipa | cut -f1)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DopamineJester-IPA
        path: DopamineJester.ipa
        retention-days: 30
