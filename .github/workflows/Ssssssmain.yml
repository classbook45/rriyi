        #import "../Exploit/bad_query.h"

        @interface DJFileExplorerViewController () <UITableViewDataSource, UITableViewDelegate>
        @property (nonatomic, strong) UITableView        *table;
        @property (nonatomic, strong) NSMutableArray<NSString *> *items;
        @property (nonatomic, copy)   NSString           *currentPath;
        @property (nonatomic, strong) UILabel            *pathLbl;
        @end

        @implementation DJFileExplorerViewController

        - (void)viewDidLoad {
            [super viewDidLoad];
            self.view.backgroundColor = UIColor.clearColor;
            self.items = [NSMutableArray new];

            self.pathLbl = [UILabel new];
            self.pathLbl.font = [UIFont fontWithName:@"Menlo" size:10] ?: [UIFont monospacedSystemFontOfSize:10 weight:UIFontWeightRegular];
            self.pathLbl.textColor = [UIColor colorWithWhite:1 alpha:0.35];
            self.pathLbl.numberOfLines = 2;
            self.pathLbl.text = @"/";
            [self.view addSubview:self.pathLbl];

            self.table = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStylePlain];
            self.table.dataSource = self; self.table.delegate = self;
            self.table.backgroundColor = UIColor.clearColor;
            self.table.separatorColor = [UIColor colorWithWhite:1 alpha:0.08];
            [self.view addSubview:self.table];

            [self loadRootPaths];
        }

        - (void)viewDidLayoutSubviews {
            [super viewDidLayoutSubviews];
            CGFloat w = self.view.bounds.size.width;
            self.pathLbl.frame = CGRectMake(16, 8, w-32, 32);
            self.table.frame   = CGRectMake(0, 48, w, self.view.bounds.size.height - 48);
        }

        - (void)loadRootPaths {
            self.currentPath = @"/";
            [self.items removeAll];
            DJTweakStore *st = [DJTweakStore shared];
            NSArray *paths = st.sandboxMode == DJSandboxModeWorseQuery
                ? wq_accessible_paths() : bq_accessible_paths();
            [self.items addObjectsFromArray:paths];
            [self.table reloadData];
        }

        - (void)loadPath:(NSString *)path {
            self.currentPath = path;
            self.pathLbl.text = path;
            [self.items removeAllObjects];
            NSError *err;
            NSArray<NSString *> *contents = [[NSFileManager defaultManager]
                contentsOfDirectoryAtPath:path error:&err];
            if (contents) {
                [self.items addObjectsFromArray:contents];
            } else {
                [self.items addObject:@"(access denied or empty)"];
            }
            [self.table reloadData];
        }

        - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s {
            return self.items.count + (![self.currentPath isEqualToString:@"/"] ? 1 : 0);
        }

        - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
            UITableViewCell *c = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:nil];
            c.backgroundColor = [UIColor colorWithWhite:1 alpha:0.04];
            c.textLabel.textColor = UIColor.whiteColor;
            c.textLabel.font = [UIFont fontWithName:@"Menlo" size:12] ?: [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];

            BOOL hasBack = ![self.currentPath isEqualToString:@"/"];
            if (hasBack && ip.row == 0) {
                c.textLabel.text = @"← ..";
                c.textLabel.textColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
                return c;
            }
            NSInteger idx = hasBack ? ip.row - 1 : ip.row;
            NSString *name = self.items[idx];
            BOOL isDir = NO;
            [[NSFileManager defaultManager] fileExistsAtPath:
                [self.currentPath stringByAppendingPathComponent:name]
                isDirectory:&isDir];
            c.textLabel.text = isDir ? [NSString stringWithFormat:@"📁 %@", name] : name;
            c.accessoryType  = isDir ? UITableViewCellAccessoryDisclosureIndicator : UITableViewCellAccessoryNone;
            return c;
        }

        - (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
            [tv deselectRowAtIndexPath:ip animated:YES];
            BOOL hasBack = ![self.currentPath isEqualToString:@"/"];
            if (hasBack && ip.row == 0) {
                [self loadPath:[self.currentPath stringByDeletingLastPathComponent] ?: @"/"];
                return;
            }
            NSInteger idx = hasBack ? ip.row - 1 : ip.row;
            NSString *name = self.items[idx];
            if ([self.currentPath isEqualToString:@"/"]) {
                [self loadPath:name];
            } else {
                NSString *full = [self.currentPath stringByAppendingPathComponent:name];
                BOOL isDir = NO;
                [[NSFileManager defaultManager] fileExistsAtPath:full isDirectory:&isDir];
                if (isDir) [self loadPath:full];
            }
        }

        @end
