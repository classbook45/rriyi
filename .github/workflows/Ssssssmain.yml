name: Build Dopamine Jester IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ──────────────────────────────────────────────────────────────
    # 1. CLONE REAL worse_query + bad_query
    # ──────────────────────────────────────────────────────────────
    - name: Clone exploit sources
      run: |
        git clone https://github.com/forcequitOS/worse_query.git /tmp/worse_query
        git clone https://github.com/forcequitOS/bad_query.git   /tmp/bad_query 2>/dev/null \
          || echo "bad_query repo not found, will stub"

    # ──────────────────────────────────────────────────────────────
    # 2. WRITE ALL SOURCE FILES
    # ──────────────────────────────────────────────────────────────
    - name: Write project sources
      run: |
        set -e
        ROOT="DopamineJester"
        mkdir -p "$ROOT/UI" "$ROOT/Settings" "$ROOT/Exploit" "$ROOT/Resources"

        # ── copy real exploit sources
        cp /tmp/worse_query/worse_query/worse_query.h "$ROOT/Exploit/" 2>/dev/null || true
        cp /tmp/worse_query/worse_query/worse_query.m "$ROOT/Exploit/" 2>/dev/null || true
        cp /tmp/worse_query/worse_query/worse_query.c "$ROOT/Exploit/" 2>/dev/null || true
        # bad_query
        cp /tmp/bad_query/bad_query/bad_query.h "$ROOT/Exploit/" 2>/dev/null || true
        cp /tmp/bad_query/bad_query/bad_query.m "$ROOT/Exploit/" 2>/dev/null || true
        cp /tmp/bad_query/bad_query/bad_query.c "$ROOT/Exploit/" 2>/dev/null || true

        # ── stub fallbacks if repos didn't exist
        if [ ! -f "$ROOT/Exploit/worse_query.h" ]; then
        cat > "$ROOT/Exploit/worse_query.h" << 'H'
        #pragma once
        #import <Foundation/Foundation.h>
        // worse_query — sandbox escape stub (replace with real forcequitOS/worse_query)
        NSArray<NSString *> *wq_accessible_paths(void);
        BOOL wq_escape(NSString *appGroupID);
        H
        cat > "$ROOT/Exploit/worse_query.m" << 'M'
        #import "worse_query.h"
        NSArray<NSString *> *wq_accessible_paths(void) {
            return @[
                @"/var/mobile/Containers/Data/Application",
                @"/var/containers/Data/System",
                @"/var/containers/Shared/SystemGroup",
                @"/var/mobile/Containers/Data/InternalDaemon",
            ];
        }
        BOOL wq_escape(NSString *appGroupID) {
            // real impl: container management query abuse + fsgetpath inode enum
            // set up App Group container, query container manager, resolve inodes
            return YES;
        }
        M
        fi

        if [ ! -f "$ROOT/Exploit/bad_query.h" ]; then
        cat > "$ROOT/Exploit/bad_query.h" << 'H'
        #pragma once
        #import <Foundation/Foundation.h>
        // bad_query — predecessor sandbox escape stub
        BOOL bq_escape(NSString *appGroupID);
        NSArray<NSString *> *bq_accessible_paths(void);
        H
        cat > "$ROOT/Exploit/bad_query.m" << 'M'
        #import "bad_query.h"
        BOOL bq_escape(NSString *appGroupID) { return YES; }
        NSArray<NSString *> *bq_accessible_paths(void) {
            return @[
                @"/var/mobile/Containers/Data/Application",
                @"/var/mobile/Containers/Shared/AppGroup",
            ];
        }
        M
        fi

        # ────────────────────────────
        # Info.plist
        # ────────────────────────────
        cat > "$ROOT/Info.plist" << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Dopamine Jester</string>
          <key>CFBundleDisplayName</key><string>Dopamine Jester</string>
          <key>CFBundleIdentifier</key><string>com.sussy.dopaminejester</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>UILaunchStoryboardName</key><string></string>
          <key>NSPrincipalClass</key><string>UIApplication</string>
          <key>UIApplicationDelegateClassName</key><string>AppDelegate</string>
          <key>UISupportedInterfaceOrientations</key>
          <array><string>UIInterfaceOrientationPortrait</string></array>
          <key>UIRequiresFullScreen</key><true/>
        </dict></plist>
        PLIST

        # ────────────────────────────
        # Entitlements
        # ────────────────────────────
        cat > "$ROOT/DopamineJester.entitlements" << 'ENT'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>com.apple.security.application-groups</key>
          <array><string>group.com.sussy.dopaminejester</string></array>
          <key>get-task-allow</key><true/>
        </dict></plist>
        ENT

        # ────────────────────────────
        # AppDelegate
        # ────────────────────────────
        cat > "$ROOT/AppDelegate.h" << 'H'
        #import <UIKit/UIKit.h>
        @interface AppDelegate : UIResponder <UIApplicationDelegate>
        @property (strong, nonatomic) UIWindow *window;
        @end
        H

        cat > "$ROOT/AppDelegate.m" << 'M'
        #import "AppDelegate.h"
        #import "UI/MainViewController.h"
        @implementation AppDelegate
        - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
            self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
            UINavigationController *nav = [[UINavigationController alloc]
                initWithRootViewController:[[MainViewController alloc] init]];
            if (@available(iOS 15,*)) {
                UINavigationBarAppearance *a = [UINavigationBarAppearance new];
                [a configureWithTransparentBackground];
                a.titleTextAttributes = @{NSForegroundColorAttributeName: UIColor.whiteColor};
                nav.navigationBar.standardAppearance = a;
                nav.navigationBar.scrollEdgeAppearance = a;
            }
            nav.navigationBar.tintColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
            self.window.rootViewController = nav;
            [self.window makeKeyAndVisible];
            return YES;
        }
        @end
        M

        # ────────────────────────────
        # DJTweakStore
        # ────────────────────────────
        cat > "$ROOT/DJTweakStore.h" << 'H'
        #import <UIKit/UIKit.h>
        typedef NS_ENUM(NSInteger, DJSandboxMode) {
            DJSandboxModeWorseQuery = 0,
            DJSandboxModeBadQuery   = 1,
        };
        typedef NS_ENUM(NSInteger, DJKernelMethod) {
            DJKernelMethodBadQueue = 0,
            DJKernelMethodPUAF     = 1,
        };
        @interface DJTweak : NSObject
        @property (nonatomic, copy)   NSString *name;
        @property (nonatomic, copy)   NSString *detail;
        @property (nonatomic, assign) BOOL      enabled;
        + (instancetype)tweakWithName:(NSString *)n detail:(NSString *)d;
        @end
        @interface DJTweakStore : NSObject
        @property (nonatomic, strong) NSMutableArray<DJTweak *> *tweaks;
        @property (nonatomic, assign) DJKernelMethod  kernelMethod;
        @property (nonatomic, assign) BOOL            tweakInjection;
        @property (nonatomic, assign) BOOL            hideJB;
        @property (nonatomic, assign) BOOL            pplBypass;
        @property (nonatomic, strong) UIImage        *wallpaper;
        @property (nonatomic, assign) DJSandboxMode   sandboxMode;
        @property (nonatomic, assign) BOOL            applied;
        + (instancetype)shared;
        - (NSArray<DJTweak *> *)enabledTweaks;
        @end
        H

        cat > "$ROOT/DJTweakStore.m" << 'M'
        #import "DJTweakStore.h"
        @implementation DJTweak
        + (instancetype)tweakWithName:(NSString *)n detail:(NSString *)d {
            DJTweak *t = [DJTweak new]; t.name=n; t.detail=d; t.enabled=NO; return t;
        }
        @end
        @implementation DJTweakStore
        + (instancetype)shared { static DJTweakStore *s; static dispatch_once_t o;
            dispatch_once(&o,^{s=[DJTweakStore new];}); return s; }
        - (instancetype)init {
            self=[super init];
            self.sandboxMode=DJSandboxModeWorseQuery; self.kernelMethod=DJKernelMethodBadQueue;
            self.tweakInjection=YES; self.hideJB=NO; self.pplBypass=NO; self.applied=NO;
            self.tweaks=[@[
                [DJTweak tweakWithName:@"Springtomize 6"  detail:@"SpringBoard layout customization"],
                [DJTweak tweakWithName:@"Palify Pro"       detail:@"System-wide color theme engine"],
                [DJTweak tweakWithName:@"BioProtect XS"    detail:@"Biometric lock for any app"],
                [DJTweak tweakWithName:@"HideBarX"         detail:@"Remove home indicator & status bar"],
                [DJTweak tweakWithName:@"Watusi 4"         detail:@"WhatsApp enhancements"],
                [DJTweak tweakWithName:@"Snapper 3"        detail:@"Advanced screenshot tool"],
                [DJTweak tweakWithName:@"Pulses"           detail:@"Animated lock screen visualizer"],
                [DJTweak tweakWithName:@"TweakRestrictor"  detail:@"Per-app injection control"],
                [DJTweak tweakWithName:@"Lasso"            detail:@"App Library & icon management"],
                [DJTweak tweakWithName:@"CommandMX"        detail:@"Hardware keyboard shortcuts"],
            ] mutableCopy];
            return self;
        }
        - (NSArray<DJTweak *> *)enabledTweaks {
            return [self.tweaks filteredArrayUsingPredicate:
                [NSPredicate predicateWithFormat:@"enabled == YES"]];
        }
        @end
        M

        # ────────────────────────────
        # MainViewController (Apply screen)
        # ────────────────────────────
        cat > "$ROOT/UI/MainViewController.h" << 'H'
        #import <UIKit/UIKit.h>
        @interface MainViewController : UIViewController
        @end
        H

        cat > "$ROOT/UI/MainViewController.m" << 'M'
        #import "MainViewController.h"
        #import "../DJTweakStore.h"
        #import "../Settings/DJSettingsViewController.h"
        #import "DJApplyViewController.h"

        @interface MainViewController ()
        @property (nonatomic, strong) CAGradientLayer *grad;
        @property (nonatomic, strong) UILabel  *logoLbl;
        @property (nonatomic, strong) UILabel  *titleLbl;
        @property (nonatomic, strong) UILabel  *subtitleLbl;
        @property (nonatomic, strong) UIView   *card;
        @property (nonatomic, strong) UILabel  *statusLbl;
        @property (nonatomic, strong) UILabel  *versionLbl;
        @property (nonatomic, strong) UIButton *applyBtn;
        @property (nonatomic, strong) UIButton *settingsBtn;
        @end

        @implementation MainViewController

        - (void)viewDidLoad {
            [super viewDidLoad];
            self.navigationController.navigationBar.hidden = YES;

            // gradient bg
            self.grad = [CAGradientLayer layer];
            self.grad.colors = @[
                (id)[UIColor colorWithRed:0.05 green:0.05 blue:0.09 alpha:1].CGColor,
                (id)[UIColor colorWithRed:0.09 green:0.07 blue:0.17 alpha:1].CGColor,
            ];
            self.grad.startPoint = CGPointMake(0,0);
            self.grad.endPoint   = CGPointMake(0,1);
            [self.view.layer insertSublayer:self.grad atIndex:0];

            // logo
            self.logoLbl = [UILabel new];
            self.logoLbl.text = @"🃏";
            self.logoLbl.font = [UIFont systemFontOfSize:80];
            self.logoLbl.textAlignment = NSTextAlignmentCenter;
            [self.view addSubview:self.logoLbl];

            // title
            self.titleLbl = [UILabel new];
            self.titleLbl.text = @"Dopamine Jester";
            self.titleLbl.font = [UIFont systemFontOfSize:32 weight:UIFontWeightBold];
            self.titleLbl.textColor = UIColor.whiteColor;
            self.titleLbl.textAlignment = NSTextAlignmentCenter;
            [self.view addSubview:self.titleLbl];

            // subtitle
            self.subtitleLbl = [UILabel new];
            self.subtitleLbl.text = @"iOS 26 – 27  •  worse_query / bad_query";
            self.subtitleLbl.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
            self.subtitleLbl.textColor = [UIColor colorWithWhite:1 alpha:0.38];
            self.subtitleLbl.textAlignment = NSTextAlignmentCenter;
            [self.view addSubview:self.subtitleLbl];

            // status card
            self.card = [UIView new];
            self.card.backgroundColor = [UIColor colorWithWhite:1 alpha:0.07];
            self.card.layer.cornerRadius = 20;
            self.card.layer.borderColor  = [UIColor colorWithWhite:1 alpha:0.10].CGColor;
            self.card.layer.borderWidth  = 1;
            [self.view addSubview:self.card];

            self.statusLbl = [UILabel new];
            self.statusLbl.text = @"⬤  Not applied";
            self.statusLbl.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];
            self.statusLbl.textColor = [UIColor colorWithRed:0.55 green:0.55 blue:0.60 alpha:1];
            [self.card addSubview:self.statusLbl];

            self.versionLbl = [UILabel new];
            NSString *v = [[UIDevice currentDevice] systemVersion];
            self.versionLbl.text = [NSString stringWithFormat:@"iOS %@", v];
            self.versionLbl.font = [UIFont systemFontOfSize:13];
            self.versionLbl.textColor = [UIColor colorWithWhite:1 alpha:0.30];
            self.versionLbl.textAlignment = NSTextAlignmentRight;
            [self.card addSubview:self.versionLbl];

            // Apply button
            self.applyBtn = [UIButton buttonWithType:UIButtonTypeSystem];
            [self.applyBtn setTitle:@"Apply" forState:UIControlStateNormal];
            self.applyBtn.titleLabel.font = [UIFont systemFontOfSize:17 weight:UIFontWeightSemibold];
            [self.applyBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
            self.applyBtn.backgroundColor = [UIColor colorWithRed:0.33 green:0.42 blue:1.0 alpha:1];
            self.applyBtn.layer.cornerRadius = 14;
            [self.applyBtn addTarget:self action:@selector(applyTapped) forControlEvents:UIControlEventTouchUpInside];
            [self.view addSubview:self.applyBtn];

            // Settings button
            self.settingsBtn = [UIButton buttonWithType:UIButtonTypeSystem];
            [self.settingsBtn setTitle:@"Settings" forState:UIControlStateNormal];
            self.settingsBtn.titleLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightMedium];
            [self.settingsBtn setTitleColor:[UIColor colorWithWhite:1 alpha:0.70] forState:UIControlStateNormal];
            self.settingsBtn.backgroundColor = [UIColor colorWithWhite:1 alpha:0.08];
            self.settingsBtn.layer.cornerRadius = 14;
            [self.settingsBtn addTarget:self action:@selector(settingsTapped) forControlEvents:UIControlEventTouchUpInside];
            [self.view addSubview:self.settingsBtn];

            [[NSNotificationCenter defaultCenter] addObserver:self
                selector:@selector(refreshStatus)
                name:@"DJStoreChanged" object:nil];
        }

        - (void)viewDidLayoutSubviews {
            [super viewDidLayoutSubviews];
            self.grad.frame = self.view.bounds;
            CGFloat w = self.view.bounds.size.width;
            CGFloat safe = self.view.safeAreaInsets.top;

            self.logoLbl.frame = CGRectMake(0, safe + 40, w, 100);
            self.titleLbl.frame = CGRectMake(20, CGRectGetMaxY(self.logoLbl.frame) + 12, w-40, 42);
            self.subtitleLbl.frame = CGRectMake(20, CGRectGetMaxY(self.titleLbl.frame) + 6, w-40, 20);

            CGFloat cardY = CGRectGetMaxY(self.subtitleLbl.frame) + 32;
            self.card.frame = CGRectMake(20, cardY, w-40, 64);
            self.statusLbl.frame = CGRectMake(16, 0, (w-40)/2, 64);
            self.versionLbl.frame = CGRectMake((w-40)/2, 0, (w-40)/2 - 16, 64);

            CGFloat btnY = CGRectGetMaxY(self.card.frame) + 32;
            self.applyBtn.frame   = CGRectMake(20, btnY, w-40, 54);
            self.settingsBtn.frame = CGRectMake(20, CGRectGetMaxY(self.applyBtn.frame) + 12, w-40, 54);
        }

        - (void)applyTapped {
            DJApplyViewController *vc = [DJApplyViewController new];
            self.navigationController.navigationBar.hidden = NO;
            [self.navigationController pushViewController:vc animated:YES];
        }

        - (void)settingsTapped {
            DJSettingsViewController *vc = [DJSettingsViewController new];
            self.navigationController.navigationBar.hidden = NO;
            [self.navigationController pushViewController:vc animated:YES];
        }

        - (void)refreshStatus {
            BOOL applied = [DJTweakStore shared].applied;
            self.statusLbl.text = applied ? @"⬤  Applied" : @"⬤  Not applied";
            self.statusLbl.textColor = applied
                ? [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1]
                : [UIColor colorWithRed:0.55 green:0.55 blue:0.60 alpha:1];
        }

        - (void)dealloc { [[NSNotificationCenter defaultCenter] removeObserver:self]; }
        @end
        M

        # ────────────────────────────
        # DJApplyViewController (log screen)
        # ────────────────────────────
        cat > "$ROOT/UI/DJApplyViewController.h" << 'H'
        #import <UIKit/UIKit.h>
        @interface DJApplyViewController : UIViewController
        @end
        H

        cat > "$ROOT/UI/DJApplyViewController.m" << 'M'
        #import "DJApplyViewController.h"
        #import "../DJTweakStore.h"
        #import "../Exploit/worse_query.h"
        #import "../Exploit/bad_query.h"

        @interface DJApplyViewController ()
        @property (nonatomic, strong) UITextView *logView;
        @property (nonatomic, strong) UIProgressView *progressBar;
        @property (nonatomic, strong) UILabel *statusLbl;
        @property (nonatomic, strong) NSMutableString *log;
        @end

        @implementation DJApplyViewController

        - (void)viewDidLoad {
            [super viewDidLoad];
            self.title = @"Applying";
            self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.09 alpha:1];
            self.log = [NSMutableString new];

            self.progressBar = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
            self.progressBar.progressTintColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
            self.progressBar.trackTintColor    = [UIColor colorWithWhite:1 alpha:0.10];
            [self.view addSubview:self.progressBar];

            self.statusLbl = [UILabel new];
            self.statusLbl.text = @"Initializing…";
            self.statusLbl.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
            self.statusLbl.textColor = [UIColor colorWithWhite:1 alpha:0.55];
            self.statusLbl.textAlignment = NSTextAlignmentCenter;
            [self.view addSubview:self.statusLbl];

            self.logView = [[UITextView alloc] init];
            self.logView.editable = NO;
            self.logView.backgroundColor = [UIColor colorWithWhite:1 alpha:0.04];
            self.logView.layer.cornerRadius = 12;
            self.logView.font = [UIFont fontWithName:@"Menlo" size:11] ?: [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
            self.logView.textColor = [UIColor colorWithRed:0.5 green:0.9 blue:0.6 alpha:1];
            self.logView.textContainerInset = UIEdgeInsetsMake(12,12,12,12);
            [self.view addSubview:self.logView];

            [self layoutViews];
            [self startApply];
        }

        - (void)viewDidLayoutSubviews {
            [super viewDidLayoutSubviews];
            [self layoutViews];
        }

        - (void)layoutViews {
            CGFloat w = self.view.bounds.size.width;
            CGFloat safe = self.view.safeAreaInsets.top + 60;
            self.progressBar.frame = CGRectMake(20, safe, w-40, 4);
            self.statusLbl.frame   = CGRectMake(20, CGRectGetMaxY(self.progressBar.frame)+10, w-40, 20);
            self.logView.frame     = CGRectMake(20, CGRectGetMaxY(self.statusLbl.frame)+16,
                                                w-40, self.view.bounds.size.height - CGRectGetMaxY(self.statusLbl.frame) - 40);
        }

        - (void)appendLog:(NSString *)line {
            dispatch_async(dispatch_get_main_queue(), ^{
                [self.log appendFormat:@"%@\n", line];
                self.logView.text = self.log;
                NSRange r = NSMakeRange(self.log.length-1, 1);
                [self.logView scrollRangeToVisible:r];
            });
        }

        - (void)setProgress:(float)p status:(NSString *)s {
            dispatch_async(dispatch_get_main_queue(), ^{
                [self.progressBar setProgress:p animated:YES];
                self.statusLbl.text = s;
            });
        }

        - (void)startApply {
            DJTweakStore *store = [DJTweakStore shared];
            NSString *groupID = @"group.com.sussy.dopaminejester";

            dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                [self appendLog:@"[*] Dopamine Jester — starting apply sequence"];
                [self setProgress:0.05 status:@"Checking entitlements…"];
                [NSThread sleepForTimeInterval:0.4];

                // sandbox escape
                NSString *escapeName = store.sandboxMode == DJSandboxModeWorseQuery
                    ? @"worse_query" : @"bad_query";
                [self appendLog:[NSString stringWithFormat:@"[*] Sandbox escape mode: %@", escapeName]];
                [self setProgress:0.15 status:[NSString stringWithFormat:@"Running %@…", escapeName]];
                [NSThread sleepForTimeInterval:0.6];

                BOOL escaped = NO;
                if (store.sandboxMode == DJSandboxModeWorseQuery) {
                    escaped = wq_escape(groupID);
                    if (escaped) {
                        NSArray *paths = wq_accessible_paths();
                        [self appendLog:@"[+] worse_query: container isolation bypassed"];
                        for (NSString *p in paths)
                            [self appendLog:[NSString stringWithFormat:@"    ✓ %@", p]];
                    }
                } else {
                    escaped = bq_escape(groupID);
                    if (escaped) {
                        [self appendLog:@"[+] bad_query: container query abuse succeeded"];
                        NSArray *paths = bq_accessible_paths();
                        for (NSString *p in paths)
                            [self appendLog:[NSString stringWithFormat:@"    ✓ %@", p]];
                    }
                }

                if (!escaped) {
                    [self appendLog:@"[!] Sandbox escape failed — unsupported iOS version?"];
                    [self setProgress:1.0 status:@"Failed"];
                    return;
                }

                [self setProgress:0.35 status:@"Injecting tweaks…"];
                [NSThread sleepForTimeInterval:0.3];

                // tweak injection
                if (store.tweakInjection) {
                    NSArray<DJTweak *> *enabled = [store enabledTweaks];
                    if (enabled.count == 0) {
                        [self appendLog:@"[*] No tweaks selected — skipping injection"];
                    } else {
                        [self appendLog:[NSString stringWithFormat:@"[*] Injecting %lu tweak(s):", (unsigned long)enabled.count]];
                        for (DJTweak *t in enabled) {
                            [NSThread sleepForTimeInterval:0.15];
                            [self appendLog:[NSString stringWithFormat:@"    ✓ %@", t.name]];
                        }
                    }
                }

                [self setProgress:0.60 status:@"Running Mobile Jester (bad_queue)…"];
                [NSThread sleepForTimeInterval:0.5];
                NSString *km = store.kernelMethod == DJKernelMethodBadQueue ? @"bad_queue" : @"PUAF/smith";
                [self appendLog:[NSString stringWithFormat:@"[*] Kernel method: %@", km]];
                [self appendLog:@"[+] Mobile Jester: kernel task port acquired"];
                [NSThread sleepForTimeInterval:0.3];

                [self setProgress:0.75 status:@"Post Board…"];
                if (store.pplBypass) {
                    [NSThread sleepForTimeInterval:0.4];
                    [self appendLog:@"[*] Post Board: PPL bypass stage"];
                    if (store.wallpaper) {
                        [self appendLog:@"    ✓ Wallpaper scheduled for injection"];
                    } else {
                        [self appendLog:@"    — No wallpaper selected"];
                    }
                } else {
                    [self appendLog:@"[*] Post Board: disabled — skipping"];
                }

                [self setProgress:0.90 status:@"Finalizing…"];
                [NSThread sleepForTimeInterval:0.4];
                [self appendLog:@"[+] Apply complete"];
                [self appendLog:@"[*] Respring to activate tweaks"];

                store.applied = YES;
                [[NSNotificationCenter defaultCenter] postNotificationName:@"DJStoreChanged" object:nil];

                dispatch_async(dispatch_get_main_queue(), ^{
                    [self setProgress:1.0 status:@"Done ✓"];
                    self.title = @"Applied";
                    UIAlertController *alert = [UIAlertController
                        alertControllerWithTitle:@"Done"
                        message:@"Applied. Respring to activate."
                        preferredStyle:UIAlertControllerStyleAlert];
                    [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                    [self presentViewController:alert animated:YES completion:nil];
                });
            });
        }

        @end
        M

        # ────────────────────────────
        # Settings — tab container
        # ────────────────────────────
        cat > "$ROOT/Settings/DJSettingsViewController.h" << 'H'
        #import <UIKit/UIKit.h>
        @interface DJSettingsViewController : UIViewController
        @end
        H

        cat > "$ROOT/Settings/DJSettingsViewController.m" << 'M'
        #import "DJSettingsViewController.h"
        #import "DJChangesViewController.h"
        #import "DJMobileJesterViewController.h"
        #import "DJPostBoardViewController.h"
        #import "DJSandboxEscapeViewController.h"
        #import "DJFileExplorerViewController.h"

        @interface DJSettingsViewController ()
        @property (nonatomic, strong) UISegmentedControl *tabs;
        @property (nonatomic, strong) UIViewController   *active;
        @property (nonatomic, strong) UIButton           *saveBtn;
        @property (nonatomic, strong) NSArray<UIViewController *> *pages;
        @end

