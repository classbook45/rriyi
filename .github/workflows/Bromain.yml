#import "DJApplyViewController.h"
#import "../DJTweakStore.h"
#import "../Exploit/bad_query.h"

@interface DJApplyViewController ()
@property (nonatomic, strong) UITextView    *logView;
@property (nonatomic, strong) UIProgressView *progressBar;
@property (nonatomic, strong) UILabel       *statusLbl;
@property (nonatomic, strong) NSMutableString *log;
@end

@implementation DJApplyViewController

- (void)viewDidLoad {
    [super viewDidLoad];
    self.title = @"Applying";
    self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.09 alpha:1];
    self.log = [NSMutableString new];

    self.progressBar = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
    self.progressBar.progressTintColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
    self.progressBar.trackTintColor    = [UIColor colorWithWhite:1 alpha:0.10];
    [self.view addSubview:self.progressBar];

    self.statusLbl = [UILabel new];
    self.statusLbl.text = @"Initializing…";
    self.statusLbl.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
    self.statusLbl.textColor = [UIColor colorWithWhite:1 alpha:0.55];
    self.statusLbl.textAlignment = NSTextAlignmentCenter;
    [self.view addSubview:self.statusLbl];

    self.logView = [UITextView new];
    self.logView.editable = NO;
    self.logView.backgroundColor = [UIColor colorWithWhite:1 alpha:0.04];
    self.logView.layer.cornerRadius = 12;
    self.logView.font = [UIFont fontWithName:@"Menlo" size:11]
        ?: [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
    self.logView.textColor = [UIColor colorWithRed:0.5 green:0.9 blue:0.6 alpha:1];
    self.logView.textContainerInset = UIEdgeInsetsMake(12,12,12,12);
    [self.view addSubview:self.logView];

    [self startApply];
}

- (void)viewDidLayoutSubviews {
    [super viewDidLayoutSubviews];
    CGFloat w = self.view.bounds.size.width;
    CGFloat safe = self.view.safeAreaInsets.top + 60;
    self.progressBar.frame = CGRectMake(20, safe, w-40, 4);
    self.statusLbl.frame   = CGRectMake(20, CGRectGetMaxY(self.progressBar.frame)+10, w-40, 20);
    self.logView.frame     = CGRectMake(20, CGRectGetMaxY(self.statusLbl.frame)+16,
                                        w-40, self.view.bounds.size.height
                                        - CGRectGetMaxY(self.statusLbl.frame) - 56);
}

- (void)appendLog:(NSString *)line {
    dispatch_async(dispatch_get_main_queue(), ^{
        [self.log appendFormat:@"%@\n", line];
        self.logView.text = self.log;
        [self.logView scrollRangeToVisible:NSMakeRange(self.log.length > 0 ? self.log.length-1 : 0, 1)];
    });
}

- (void)setProgress:(float)p status:(NSString *)s {
    dispatch_async(dispatch_get_main_queue(), ^{
        [self.progressBar setProgress:p animated:YES];
        self.statusLbl.text = s;
    });
}

- (void)startApply {
    DJTweakStore *store = [DJTweakStore shared];
    NSString *groupID = @"group.com.sussy.dopaminejester";

    dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
        [self appendLog:@"[*] Dopamine Jester — starting apply sequence"];
        [self setProgress:0.05 status:@"Checking entitlements…"];
        [NSThread sleepForTimeInterval:0.4];

        [self appendLog:@"[*] Sandbox escape: bad_query"];
        [self setProgress:0.15 status:@"Running bad_query…"];
        [NSThread sleepForTimeInterval:0.6];

        BOOL escaped = bq_escape(groupID);
        if (escaped) {
            [self appendLog:@"[+] bad_query: container query abuse succeeded"];
            NSArray *paths = bq_accessible_paths();
            for (NSString *p in paths)
                [self appendLog:[NSString stringWithFormat:@"    ✓ %@", p]];
        } else {
            [self appendLog:@"[!] Sandbox escape failed — unsupported iOS version?"];
            [self setProgress:1.0 status:@"Failed"];
            return;
        }

        [self setProgress:0.35 status:@"Injecting tweaks…"];
        [NSThread sleepForTimeInterval:0.3];

        if (store.tweakInjection) {
            NSArray<DJTweak *> *enabled = [store enabledTweaks];
            if (enabled.count == 0) {
                [self appendLog:@"[*] No tweaks selected — skipping injection"];
            } else {
                [self appendLog:[NSString stringWithFormat:@"[*] Injecting %lu tweak(s):", (unsigned long)enabled.count]];
                for (DJTweak *t in enabled) {
                    [NSThread sleepForTimeInterval:0.15];
                    [self appendLog:[NSString stringWithFormat:@"    ✓ %@", t.name]];
                }
            }
        }

        [self setProgress:0.60 status:@"Running Mobile Jester (bad_queue)…"];
        [NSThread sleepForTimeInterval:0.5];
        NSString *km = store.kernelMethod == DJKernelMethodBadQueue ? @"bad_queue" : @"PUAF/smith";
        [self appendLog:[NSString stringWithFormat:@"[*] Kernel method: %@", km]];
        [self appendLog:@"[+] Mobile Jester: kernel task port acquired"];
        [NSThread sleepForTimeInterval:0.3];

        [self setProgress:0.75 status:@"Post Board…"];
        if (store.pplBypass) {
            [NSThread sleepForTimeInterval:0.4];
            [self appendLog:@"[*] Post Board: PPL bypass stage"];
            if (store.wallpaper)
                [self appendLog:@"    ✓ Wallpaper scheduled for injection"];
            else
                [self appendLog:@"    — No wallpaper selected"];
        } else {
            [self appendLog:@"[*] Post Board: disabled — skipping"];
        }

        [self setProgress:0.90 status:@"Finalizing…"];
        [NSThread sleepForTimeInterval:0.4];
        [self appendLog:@"[+] Apply complete"];
        [self appendLog:@"[*] Respring to activate tweaks"];

        store.applied = YES;
        [[NSNotificationCenter defaultCenter] postNotificationName:@"DJStoreChanged" object:nil];

        dispatch_async(dispatch_get_main_queue(), ^{
            [self setProgress:1.0 status:@"Done ✓"];
            self.title = @"Applied";
            UIAlertController *alert = [UIAlertController
                alertControllerWithTitle:@"Done"
                message:@"Applied. Respring to activate."
                preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
            [self presentViewController:alert animated:YES completion:nil];
        });
    });
}
@end
