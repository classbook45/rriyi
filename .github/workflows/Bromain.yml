#import "DJSettingsViewController.h"
#import "DJChangesViewController.h"
#import "DJMobileJesterViewController.h"
#import "DJPostBoardViewController.h"
#import "DJFileExplorerViewController.h"

@interface DJSettingsViewController ()
@property (nonatomic, strong) UISegmentedControl *tabs;
@property (nonatomic, strong) UIViewController   *active;
@property (nonatomic, strong) UIButton           *saveBtn;
@property (nonatomic, strong) NSArray<UIViewController *> *pages;
@end

@implementation DJSettingsViewController

- (void)viewDidLoad {
    [super viewDidLoad];
    self.title = @"Settings";
    self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.09 alpha:1];

    self.pages = @[
        [DJChangesViewController new],
        [DJMobileJesterViewController new],
        [DJPostBoardViewController new],
        [DJFileExplorerViewController new],
    ];

    self.tabs = [[UISegmentedControl alloc] initWithItems:@[
        @"Changes", @"M.Jester", @"Post Board", @"Files"
    ]];
    self.tabs.selectedSegmentIndex = 0;
    self.tabs.tintColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
    [self.tabs addTarget:self action:@selector(tabChanged) forControlEvents:UIControlEventValueChanged];
    self.navigationItem.titleView = self.tabs;

    self.saveBtn = [UIButton buttonWithType:UIButtonTypeSystem];
    [self.saveBtn setTitle:@"Save" forState:UIControlStateNormal];
    self.saveBtn.titleLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightSemibold];
    [self.saveBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
    self.saveBtn.backgroundColor = [UIColor colorWithRed:0.33 green:0.42 blue:1.0 alpha:1];
    self.saveBtn.layer.cornerRadius = 14;
    [self.saveBtn addTarget:self action:@selector(saveTapped) forControlEvents:UIControlEventTouchUpInside];
    [self.view addSubview:self.saveBtn];

    [self tabChanged];
}

- (void)viewDidLayoutSubviews {
    [super viewDidLayoutSubviews];
    CGFloat w = self.view.bounds.size.width;
    CGFloat bh = self.view.bounds.size.height;
    CGFloat safe = self.view.safeAreaInsets.bottom;
    self.saveBtn.frame = CGRectMake(20, bh - safe - 70, w-40, 54);

    if (self.active) {
        CGFloat top = self.view.safeAreaInsets.top + 10;
        self.active.view.frame = CGRectMake(0, top, w, bh - safe - 80 - top);
    }
}

- (void)tabChanged {
    if (self.active) {
        [self.active willMoveToParentViewController:nil];
        [self.active.view removeFromSuperview];
        [self.active removeFromParentViewController];
    }
    NSInteger idx = self.tabs.selectedSegmentIndex;
    UIViewController *vc = self.pages[idx];
    [self addChildViewController:vc];
    [self.view insertSubview:vc.view belowSubview:self.saveBtn];
    [vc didMoveToParentViewController:self];
    self.active = vc;
    [self.view setNeedsLayout];
}

- (void)saveTapped {
    [[NSNotificationCenter defaultCenter] postNotificationName:@"DJStoreChanged" object:nil];
    [self.navigationController popViewControllerAnimated:YES];
}
@end
