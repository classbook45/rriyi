    cat > "project.yml" << 'YEOF'
name: DopamineJester
options:
  bundleIdPrefix: com.sussy
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "16"
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.sussy.dopaminejester
    INFOPLIST_FILE: DopamineJester/Info.plist
    CODE_SIGN_ENTITLEMENTS: DopamineJester/DopamineJester.entitlements
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DopamineJester:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: DopamineJester
        excludes:
          - "**/*.md"
          - "**/*.plist"
          - "**/*.entitlements"
YEOF

    # ────────────────────────────
    # Install xcodegen
    # ────────────────────────────
    - name: Install xcodegen
      run: brew install xcodegen

    # ────────────────────────────
    # Generate Xcode project
    # ────────────────────────────
    - name: Generate Xcode project
      run: xcodegen generate

    # ────────────────────────────
    # Build unsigned IPA
    # ────────────────────────────
    - name: Build IPA
      run: |
        xcodebuild \
          -project DopamineJester.xcodeproj \
          -scheme DopamineJester \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          -derivedDataPath build

        APP=$(find build -name "DopamineJester.app" | head -1)
        mkdir -p Payload
        cp -r "$APP" Payload/
        zip -r DopamineJester.ipa Payload

    # ────────────────────────────
    # Upload artifact
    # ────────────────────────────
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DopamineJester
        path: DopamineJester.ipa
