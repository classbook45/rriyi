}
- (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return 1; }

- (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
    UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:@"pb"];
    if (!cell) cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"pb"];
    cell.backgroundColor = [UIColor colorWithWhite:1 alpha:0.07];
    cell.textLabel.textColor = UIColor.whiteColor;

    if (ip.section == 0) {
        cell.textLabel.text = @"Enable PPL Bypass";
        UISwitch *sw = [UISwitch new];
        sw.on = [DJTweakStore shared].pplBypass;
