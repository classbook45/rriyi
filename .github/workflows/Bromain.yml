#import "DJFileExplorerViewController.h"
#import "../DJTweakStore.h"
#import "../Exploit/bad_query.h"

@interface DJFileExplorerViewController () <UITableViewDataSource, UITableViewDelegate>
@property (nonatomic, strong) UITableView *table;
@property (nonatomic, strong) NSString    *currentPath;
@property (nonatomic, strong) NSArray<NSString *> *items;
@end

@implementation DJFileExplorerViewController

- (void)viewDidLoad {
    [super viewDidLoad];
    self.view.backgroundColor = UIColor.clearColor;
    self.table = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStylePlain];
    self.table.backgroundColor = UIColor.clearColor;
    self.table.dataSource = self;
    self.table.delegate   = self;
    self.table.separatorColor = [UIColor colorWithWhite:1 alpha:0.08];
    [self.view addSubview:self.table];

    // load root paths from bad_query
    NSArray *roots = bq_accessible_paths();
    self.currentPath = nil;
    NSMutableArray *display = [NSMutableArray new];
    for (NSString *p in roots) {
        BOOL isDir = NO;
        BOOL exists = [[NSFileManager defaultManager] fileExistsAtPath:p isDirectory:&isDir];
        if (exists && isDir) [display addObject:p];
        else                 [display addObject:p]; // show even if inaccessible
    }
    self.items = display;
}

- (void)viewDidLayoutSubviews {
    [super viewDidLayoutSubviews];
    self.table.frame = self.view.bounds;
}

- (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s {
    return self.currentPath ? self.items.count + 1 : self.items.count;
}

- (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
    UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:@"fe"];
    if (!cell) {
        cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"fe"];
        cell.textLabel.font = [UIFont fontWithName:@"Menlo" size:12]
            ?: [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
    }
    cell.backgroundColor = UIColor.clearColor;
    cell.textLabel.textColor = [UIColor colorWithRed:0.5 green:0.9 blue:0.6 alpha:1];

    if (self.currentPath && ip.row == 0) {
        cell.textLabel.text = @"← ..";
        cell.accessoryType  = UITableViewCellAccessoryNone;
        return cell;
    }

    NSInteger itemIdx = self.currentPath ? ip.row - 1 : ip.row;
    NSString *name = self.items[itemIdx];
    NSString *fullPath = self.currentPath
        ? [self.currentPath stringByAppendingPathComponent:name]
        : name;

    BOOL isDir = NO;
    [[NSFileManager defaultManager] fileExistsAtPath:fullPath isDirectory:&isDir];
    cell.textLabel.text = isDir
        ? [NSString stringWithFormat:@"📁 %@", name]
        : [NSString stringWithFormat:@"   %@", name];
    cell.accessoryType = isDir ? UITableViewCellAccessoryDisclosureIndicator : UITableViewCellAccessoryNone;
    return cell;
}

- (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
    [tv deselectRowAtIndexPath:ip animated:YES];

    if (self.currentPath && ip.row == 0) {
        // go up
        NSString *parent = [self.currentPath stringByDeletingLastPathComponent];
        BOOL isRoot = NO;
        for (NSString *r in bq_accessible_paths()) {
            if ([r isEqualToString:self.currentPath]) { isRoot=YES; break; }
        }
        if (isRoot) {
            self.currentPath = nil;
            self.items = bq_accessible_paths();
        } else {
            self.currentPath = parent;
            [self loadDir:parent];
        }
        [self.table reloadData];
        return;
    }

    NSInteger itemIdx = self.currentPath ? ip.row - 1 : ip.row;
    NSString *name = self.items[itemIdx];
    NSString *fullPath = self.currentPath
        ? [self.currentPath stringByAppendingPathComponent:name]
        : name;

    BOOL isDir = NO;
    [[NSFileManager defaultManager] fileExistsAtPath:fullPath isDirectory:&isDir];
    if (isDir) {
        self.currentPath = fullPath;
        [self loadDir:fullPath];
        [self.table reloadData];
    }
}

- (void)loadDir:(NSString *)path {
    NSError *err = nil;
    NSArray *contents = [[NSFileManager defaultManager] contentsOfDirectoryAtPath:path error:&err];
    self.items = contents ?: @[];
}
@end
