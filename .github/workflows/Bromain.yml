#import <UIKit/UIKit.h>
typedef NS_ENUM(NSInteger, DJKernelMethod) {
    DJKernelMethodBadQueue = 0,
    DJKernelMethodPUAF     = 1,
};
@interface DJTweak : NSObject
@property (nonatomic, copy)   NSString *name;
@property (nonatomic, copy)   NSString *detail;
@property (nonatomic, assign) BOOL      enabled;
+ (instancetype)tweakWithName:(NSString *)n detail:(NSString *)d;
@end
@interface DJTweakStore : NSObject
@property (nonatomic, strong) NSMutableArray<DJTweak *> *tweaks;
@property (nonatomic, assign) DJKernelMethod  kernelMethod;
@property (nonatomic, assign) BOOL            tweakInjection;
@property (nonatomic, assign) BOOL            hideJB;
@property (nonatomic, assign) BOOL            pplBypass;
@property (nonatomic, strong) UIImage        *wallpaper;
@property (nonatomic, assign) BOOL            applied;
+ (instancetype)shared;
- (NSArray<DJTweak *> *)enabledTweaks;
@end
HEOF

        cat > "$ROOT/DJTweakStore.m" << 'MEOF'
#import "DJTweakStore.h"
@implementation DJTweak
+ (instancetype)tweakWithName:(NSString *)n detail:(NSString *)d {
    DJTweak *t = [DJTweak new]; t.name=n; t.detail=d; t.enabled=NO; return t;
}
@end
@implementation DJTweakStore
+ (instancetype)shared { static DJTweakStore *s; static dispatch_once_t o;
    dispatch_once(&o,^{s=[DJTweakStore new];}); return s; }
- (instancetype)init {
    self=[super init];
    self.kernelMethod=DJKernelMethodBadQueue;
    self.tweakInjection=YES; self.hideJB=NO; self.pplBypass=NO; self.applied=NO;
    self.tweaks=[@[
        [DJTweak tweakWithName:@"Springtomize 6"  detail:@"SpringBoard layout customization"],
        [DJTweak tweakWithName:@"Palify Pro"       detail:@"System-wide color theme engine"],
        [DJTweak tweakWithName:@"BioProtect XS"    detail:@"Biometric lock for any app"],
        [DJTweak tweakWithName:@"HideBarX"         detail:@"Remove home indicator & status bar"],
        [DJTweak tweakWithName:@"Watusi 4"         detail:@"WhatsApp enhancements"],
        [DJTweak tweakWithName:@"Snapper 3"        detail:@"Advanced screenshot tool"],
        [DJTweak tweakWithName:@"Pulses"           detail:@"Animated lock screen visualizer"],
        [DJTweak tweakWithName:@"TweakRestrictor"  detail:@"Per-app injection control"],
        [DJTweak tweakWithName:@"Lasso"            detail:@"App Library & icon management"],
        [DJTweak tweakWithName:@"CommandMX"        detail:@"Hardware keyboard shortcuts"],
    ] mutableCopy];
    return self;
}
- (NSArray<DJTweak *> *)enabledTweaks {
    return [self.tweaks filteredArrayUsingPredicate:
        [NSPredicate predicateWithFormat:@"enabled == YES"]];
}
@end
MEOF

