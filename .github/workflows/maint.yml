name: Auto-Bump & Build Quest NoodleExtensions (1.45.3

on:
  workflow_dispatch:
    inputs:
      target_bs_version:
        description: 'Target moddable Quest Beat Saber version'
        required: true
        default: '1.45.3'

jobs:
  bump-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Clone bsq-ports/NoodleExtensions
        uses: actions/checkout@v4
        with:
          repository: bsq-ports/NoodleExtensions
          submodules: recursive
          path: noodle-repo

      - name: Install QPM CLI (Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/qpm-dl
          gh release download --repo QuestPackageManager/QPM.CLI --pattern "*linux*" --dir /tmp/qpm-dl || true
          ls -la /tmp/qpm-dl

          # Extract if zipped/tarred, or copy binary directly
          if ls /tmp/qpm-dl/*.zip 1> /dev/null 2>&1; then
            unzip -o /tmp/qpm-dl/*.zip -d /tmp/qpm-dl/extracted
            QPM_BIN=$(find /tmp/qpm-dl/extracted -type f -name "qpm*" | head -n 1)
          elif ls /tmp/qpm-dl/*.tar.gz 1> /dev/null 2>&1; then
            tar -xzf /tmp/qpm-dl/*.tar.gz -C /tmp/qpm-dl
            QPM_BIN=$(find /tmp/qpm-dl -type f -name "qpm*" | head -n 1)
          else
            QPM_BIN=$(find /tmp/qpm-dl -type f | head -n 1)
          fi

          # Fallback: build QPM from source via Cargo if no prebuilt Linux release asset exists
          if [ -z "$QPM_BIN" ]; then
            echo "No prebuilt Linux asset found; compiling QPM from source..."
            cargo install --git https://github.com --root /usr/local
          else
            sudo mv "$QPM_BIN" /usr/local/bin/qpm
            sudo chmod +x /usr/local/bin/qpm
          fi

          qpm --version

      - name: Update target Beat Saber version & dependencies in repo files
        working-directory: noodle-repo
        run: |
          TARGET_VER="${{ github.event.inputs.target_bs_version }}"
          # Convert 1.45.3 -> 4503.* format used by bs-cordl
          MAJOR_MINOR=$(echo "$TARGET_VER" | awk -F. '{printf "%d%02d", $2, $3}')
          echo "Updating project files to target Beat Saber $TARGET_VER (cordl: ${MAJOR_MINOR}.*)..."

          # Update packageVersion in mod.template.json and qpm.json
          sed -i "s/\"packageVersion\": \"[0-9.]*\"/\"packageVersion\": \"$TARGET_VER\"/g" mod.template.json || true
          sed -i "s/\"packageVersion\": \"[0-9.]*\"/\"packageVersion\": \"$TARGET_VER\"/g" qpm.json || true

          # Update bs-cordl dependency range in qpm.json if present
          sed -i "s/\"versionRange\": \"[0-9]*\.\*\"/\"versionRange\": \"${MAJOR_MINOR}.*\"/g" qpm.json || true

          # Restore & update QPM dependencies
          qpm restore

      - name: Configure Android NDK & Build .qmod
        working-directory: noodle-repo
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          # Build the mod and generate NoodleExtensions.qmod using the repo's PowerShell scripts
          pwsh ./scripts/build.ps1 --release
          pwsh ./scripts/createqmod.ps1

      - name: Upload compiled .qmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoodleExtensions-${{ github.event.inputs.target_bs_version }}-qmod
          path: noodle-repo/*.qmod
          retention-days: 14
