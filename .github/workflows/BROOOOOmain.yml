name: port-all

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "full packageVersion"
        default: "1.45.3_30054"
        required: true
      cordl_range:
        description: "bs-cordl range"
        default: "^4503.0.0"
        required: true
      cjd_url:
        description: "customjsondata repo"
        default: "https://github.com/bsq-ports/CustomJSONData"
        required: true
      cjd_branch:
        description: "customjsondata branch"
        default: "main"
        required: true
      tracks_url:
        description: "tracks repo"
        default: "https://github.com/bsq-ports/Tracks"
        required: true
      tracks_branch:
        description: "tracks branch"
        default: "master"
        required: true
      chroma_url:
        description: "chroma repo"
        default: "https://github.com/bsq-ports/Chroma"
        required: true
      chroma_branch:
        description: "chroma branch"
        default: "main"
        required: true
      noodle_url:
        description: "noodle repo"
        default: "https://github.com/bsq-ports/NoodleExtensions"
        required: true
      noodle_branch:
        description: "noodle branch"
        default: "master"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CORDL_RANGE: ${{ inputs.cordl_range }}
      CJD_URL: ${{ inputs.cjd_url }}
      CJD_BRANCH: ${{ inputs.cjd_branch }}
      TRACKS_URL: ${{ inputs.tracks_url }}
      TRACKS_BRANCH: ${{ inputs.tracks_branch }}
      CHROMA_URL: ${{ inputs.chroma_url }}
      CHROMA_BRANCH: ${{ inputs.chroma_branch }}
      NOODLE_URL: ${{ inputs.noodle_url }}
      NOODLE_BRANCH: ${{ inputs.noodle_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: list branches
        run: |
          export GIT_TERMINAL_PROMPT=0
          for u in "$CJD_URL" "$TRACKS_URL" "$CHROMA_URL" "$NOODLE_URL"; do
            echo "== $u"
            if ! out="$(git ls-remote --symref "$u" HEAD 2>/dev/null)"; then
              echo "repo not found"
              continue
            fi
            echo "$out" | head -n1
            git ls-remote --heads "$u" | sed 's#.*refs/heads/##'
          done

      - name: validate inputs
        run: |
          for u in "$CJD_URL" "$TRACKS_URL" "$CHROMA_URL" "$NOODLE_URL"; do
            case "$u" in
              https://github.com/*) ;;
              *) echo "repo urls must start with https://github.com/"; exit 1 ;;
            esac
          done
          GAME="${PACKAGE_VERSION%%_*}"
          if ! [[ "$GAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package_version must look like 1.45.3_30054"; exit 1
          fi
          if [ -z "$CORDL_RANGE" ]; then
            IFS=. read -r MAJ MIN PAT <<< "$GAME"
            echo "CORDL_RANGE=^$((10#$MIN * 100 + 10#$PAT)).0.0" >> "$GITHUB_ENV"
          fi

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl python3

      - name: rust android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - name: install qpm
        run: |
          mkdir -p "$HOME/.local/bin"
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/QuestPackageManager/QPM.CLI/releases/latest \
            | python3 -c '
          import json, sys
          for a in json.load(sys.stdin).get("assets", []):
              n = a["name"].lower()
              if "linux" in n and any(k in n for k in ("x64", "x86_64", "amd64")):
                  print(a["browser_download_url"])
                  break
          ')"
          if [ -z "$URL" ]; then echo "no linux qpm asset found"; exit 1; fi
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/dl"
          case "$URL" in
            *.zip) unzip -o -q "$TMP/dl" -d "$TMP/x" ;;
            *) mkdir -p "$TMP/x"; cp "$TMP/dl" "$TMP/x/qpm" ;;
          esac
          BIN="$(find "$TMP/x" -type f -name 'qpm*' ! -name '*.md' | head -n1)"
          install -m 755 "$BIN" "$HOME/.local/bin/qpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: write port script
        run: |
          cat > port_all.py <<'PY'
          import json, os, re, shutil, subprocess, sys, time
          from collections import Counter
          from pathlib import Path

          WS = Path(os.environ["GITHUB_WORKSPACE"])
          PKG = os.environ["PACKAGE_VERSION"]
          CORDL = os.environ["CORDL_RANGE"]
          SUMMARY = Path(os.environ["GITHUB_STEP_SUMMARY"])
          ERR = re.compile(r"^(.*?):(\d+):(\d+): (?:fatal )?error: (.*)$", re.M)

          # Force these ranges everywhere (including inside CustomJSONData itself)
          DEP_RANGES = {
              "bs-cordl": CORDL,
              "beatsaber-hook": "^9.4.3",
              "custom-types": "^0.21.2",
              "bsml": "^0.6.5",
              "songcore": "^1.3.5",
              "config-utils": "^3.0.0",
              "custom-json-data": "*",
              "tracks": "*",
          }
          NDK_RANGE = "^29.0.0"

          MODS = [
              ("customjsondata", os.environ["CJD_URL"], os.environ["CJD_BRANCH"]),
              ("tracks",         os.environ["TRACKS_URL"], os.environ["TRACKS_BRANCH"]),
              ("chroma",         os.environ["CHROMA_URL"], os.environ["CHROMA_BRANCH"]),
              ("noodle",         os.environ["NOODLE_URL"], os.environ["NOODLE_BRANCH"]),
          ]

          # filled as we successfully build each mod → used for localPath
          built_locals = {}


          def sh(cmd, cwd, log):
              log.write("$ " + " ".join(cmd) + "\n")
              p = subprocess.run(
                  cmd, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  text=True, errors="replace",
              )
              log.write(p.stdout + "\n")
              log.flush()
              return p.returncode, p.stdout


          def tail(text, n=4000):
              return text[-n:]


          def load(path):
              with open(path, encoding="utf-8-sig") as f:
                  return json.load(f)


          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")


          def has_script(repo, name):
              try:
                  scripts = load(repo / "qpm.json").get("workspace", {}).get("scripts", {})
              except (OSError, ValueError):
                  return False
              return name in scripts


          def patch(repo, log):
              notes = []

              # 1. Update packageVersion in template / mod.json
              for path in list(repo.glob("*.template.json")) + list(repo.glob("mod.json")):
                  d = load(path)
                  if "packageVersion" in d:
                      d["packageVersion"] = PKG
                      save(path, d)
                      notes.append(f"{path.name}: packageVersion -> {PKG}")

              # 2. Force modern dependency ranges + inject localPath
              q = repo / "qpm.json"
              if q.exists():
                  d = load(q)

                  for dep in d.get("dependencies", []):
                      dep_id = dep.get("id")

                      # force known good ranges
                      want = DEP_RANGES.get(dep_id)
                      if want and dep.get("versionRange") != want:
                          notes.append(f"{dep_id}: {dep.get('versionRange')} -> {want}")
                          dep["versionRange"] = want

                      # if we already built this dependency, point at the local tree
                      if dep_id in built_locals:
                          local_path = built_locals[dep_id]
                          add = dep.setdefault("additionalData", {})
                          if add.get("localPath") != local_path:
                              add["localPath"] = local_path
                              # also relax the version range so the resolver is happy
                              dep["versionRange"] = "*"
                              notes.append(f"{dep_id}: localPath = {local_path}")

                  ws = d.setdefault("workspace", {})
                  notes.append(f"ndk: {ws.get('ndk')} -> {NDK_RANGE}")
                  ws["ndk"] = NDK_RANGE
                  save(q, d)

              # 3. C++20 → C++23
              cm = repo / "CMakeLists.txt"
              if cm.exists():
                  text = cm.read_text(encoding="utf-8", errors="replace")
                  new = re.sub(r"(CXX_STANDARD\s+)20\b", r"\g<1>23", text)
                  new = new.replace("c++20", "c++23").replace("gnu++20", "gnu++23")
                  if new != text:
                      cm.write_text(new, encoding="utf-8")
                      notes.append("CMakeLists.txt: c++20 -> c++23")

              # always wipe shared so restore is clean
              (repo / "qpm.shared.json").unlink(missing_ok=True)

              log.write("patches:\n" + "\n".join("  " + n for n in notes) + "\n\n")
              return notes


          def clusters(text):
              errs = ERR.findall(text)
              if not errs:
                  return ""
              kinds = Counter(re.sub(r"'[^']*'", "'_'", m)[:100] for _, _, _, m in errs)
              files = Counter(p for p, _, _, _ in errs)
              lines = [f"{len(errs)} compiler errors in {len(files)} files", "", "by type:"]
              lines += [f"- {n}x `{k}`" for k, n in kinds.most_common(12)]
              lines += ["", "worst files:"]
              lines += [f"- {n}x `{p}`" for p, n in files.most_common(8)]
              return "\n".join(lines)


          def build_cmds(repo):
              if has_script(repo, "build"):
                  return [["qpm", "s", "build"]]
              if (repo / "build.ps1").exists():
                  return [["pwsh", "./build.ps1"]]
              return [
                  ["cmake", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=RelWithDebInfo", "-B", "build", "."],
                  ["cmake", "--build", "build"],
              ]


          def package_cmd(repo, name):
              if has_script(repo, "qmod"):
                  return ["qpm", "s", "qmod"]
              if (repo / "createqmod.ps1").exists():
                  return ["pwsh", "./createqmod.ps1", name]
              return ["qpm", "qmod", "zip"]


          def build_one(name, url, branch):
              repo = WS / "src" / name
              out  = WS / "out" / name
              out.mkdir(parents=True, exist_ok=True)
              (WS / "logs").mkdir(exist_ok=True)

              with open(WS / "logs" / f"{name}.log", "w", encoding="utf-8") as log:
                  # clone
                  clone = ["git", "clone", "--depth", "1"]
                  if branch:
                      clone += ["--branch", branch]
                  rc, text = sh(clone + [url, str(repo)], WS, log)
                  if rc:
                      return "clone failed", "check the url and branch", tail(text)

                  # patch (ranges + localPath + c++23)
                  patch(repo, log)

                  # ndk
                  rc, text = sh(["qpm", "ndk", "resolve", "-d"], repo, log)
                  if rc:
                      print(tail(text), flush=True)
                      return "ndk failed", "ndk resolve did not finish", tail(text)

                  # restore
                  rc, text = sh(["qpm", "restore"], repo, log)
                  if rc:
                      print("--- restore output ---\n" + tail(text) + "\n--- end ---", flush=True)
                      return "restore failed", "dependency resolution failed", tail(text)

                  # build
                  started = time.time()
                  for cmd in build_cmds(repo):
                      rc, text = sh(cmd, repo, log)
                      if rc:
                          found = clusters(text)
                          return "build failed", "source needs manual fixes", found or tail(text)

                  # package
                  rc, text = sh(package_cmd(repo, name), repo, log)
                  if rc:
                      print("--- package output ---\n" + tail(text) + "\n--- end ---", flush=True)
                      return "package failed", "qmod packaging did not finish", tail(text)

                  # collect qmods
                  count = 0
                  for f in repo.rglob("*.qmod"):
                      if f.stat().st_mtime >= started:
                          shutil.copy2(f, out / f.name)
                          count += 1
                  if count == 0:
                      return "no qmod", "build passed but no new qmod appeared", ""

                  # register for later localPath usage
                  id_map = {
                      "customjsondata": "custom-json-data",
                      "tracks":         "tracks",
                      "chroma":         "chroma",
                      "noodle":         "noodle-extensions",
                  }
                  pkg_id = id_map.get(name, name)
                  built_locals[pkg_id] = str(repo.resolve())
                  log.write(f"registered localPath for {pkg_id} -> {repo}\n")

                  return "built", f"{count} qmod file(s)", ""


          def main():
              rows = []
              details = []
              failed = 0
              for name, url, branch in MODS:
                  print(f"=== {name} ===", flush=True)
                  status, note, detail = build_one(name, url, branch)
                  print(f"{name}: {status} - {note}", flush=True)
                  rows.append(f"| {name} | {status} | {note} |")
                  if status != "built":
                      failed += 1
                      if detail:
                          details.append(f"### {name}\n\n```\n{detail}\n```\n")

              with open(SUMMARY, "a", encoding="utf-8") as s:
                  s.write(f"## port to {PKG} (bs-cordl {CORDL})\n\n")
                  s.write("| mod | result | note |\n|-----|--------|------|\n")
                  s.write("\n".join(rows) + "\n\n")
                  if failed:
                      s.write("CustomJSONData must succeed first so later mods can use localPath.\n\n")
                  s.write("\n".join(details))
              sys.exit(1 if failed else 0)


          main()
          PY

      - name: port all four
        run: python3 port_all.py

      - name: upload qmods
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ported-qmods
          path: out/**/*.qmod
          retention-days: 14
          if-no-files-found: ignore

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
